# ============================================================================
# Build System
# ============================================================================

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"


# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "safecommit-cli"
version = "1.0.1"

description = "A lightweight cross-platform CLI that detects exposed secrets, API keys, credentials, tokens, and sensitive information before you commit."

readme = "README.md"

requires-python = ">=3.11"

license = "MIT"

authors = [
    { name = "Sushant Kumar Kushwaha" }
]

keywords = [
    "security",
    "secret-scanner",
    "secret-detection",
    "api-key",
    "credentials",
    "token",
    "git",
    "cli",
    "developer-tools",
    "cybersecurity",
    "python",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
]


# ============================================================================
# Optional Dependencies
# ============================================================================

[project.optional-dependencies]

dev = [
    "pytest>=8.4",
    "black>=25.0",
    "ruff>=0.12",
]


# ============================================================================
# Project URLs
# ============================================================================

[project.urls]

Homepage = "https://github.com/sushantkr1187/SafeCommit"

Repository = "https://github.com/sushantkr1187/SafeCommit"

Issues = "https://github.com/sushantkr1187/SafeCommit/issues"

Changelog = "https://github.com/sushantkr1187/SafeCommit/blob/main/CHANGELOG.md"


# ============================================================================
# CLI Entry Point
# ============================================================================

[project.scripts]

safecommit = "safecommit.cli:main"


# ============================================================================
# Package Discovery
# ============================================================================

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]

where = ["src"]


# ============================================================================
# Formatting
# ============================================================================

[tool.black]

line-length = 88

target-version = ["py311"]


# ============================================================================
# Ruff
# ============================================================================

[tool.ruff]

line-length = 88

target-version = "py311"


# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]

testpaths = ["tests"]
